base:
  version: VERSION
  css:
    theme:
      # tokens.css must load first - all DS 4.6+ CSS depends on its custom properties.
      assets/gov-design-system/gov-styles/tokens.css: {}
      assets/gov-design-system/gov-styles/animations.css: {}
      assets/gov-design-system/gov-styles/content.css: {}
      assets/gov-design-system/gov-styles/layout.css: {}
      assets/gov-design-system/gov-styles/print.css: {}
      assets/gov-design-system/gov-styles/styles.css: {}
  dependencies:
    - gov_cz/legacy-tokens

# Old --gov-* design tokens (DS <= 4.0.x). DS 4.6+ renamed all tokens; keeping
# the old definitions available preserves legacy components and site overrides.
legacy-tokens:
  css:
    theme:
      assets/variables/_colors.css: {}
      assets/variables/_text.css: {}
      assets/variables/_misc.css: {}

throbber:
  css:
    component:
      assets/gov-design-system/gov-components/gov-loading.css: {}
      assets/gov-design-system/gov-components/gov-backdrop.css: {}
  js:
    components/gov-loading/loading.js: {}
  dependencies:
    - core/drupal

# Gov.cz libraries without SDC.
gov-grid:
  css:
    theme:
      assets/gov-design-system/gov-components/gov-grid.css: {}

gov-grid-item:
  css:
    theme:
      assets/gov-design-system/gov-components/gov-grid-item.css: {}

gov-icon:
  css:
    theme:
      assets/gov-design-system/gov-components/gov-icon.css: {}

# Deprecated DS 4.0 stepper look (markup contract changed in DS 4.6; the
# legacy CSS is dark mode capable via remapped semantic tokens).
gov-stepper:
  css:
    theme:
      assets/variables/stepper.css: {}
      assets/legacy/gov-components/gov-stepper.css: {}
      assets/legacy/gov-components/gov-stepper-item.css: {}

theme-switch:
  css:
    theme:
      assets/gov-design-system/gov-components/gov-theme-switch.css: {}

# Gov.cz form libraries for manually crafted forms
gov-form-input:
  css:
    theme:
      assets/gov-design-system/gov-components/gov-form-input.css: {}

gov-button:
  css:
    theme:
      assets/gov-design-system/gov-components/gov-button.css: {}

# Custom styles
overrides:
  css:
    component:
      assets/additions/overrides.css: {}

font-face:
  css:
    component:
      assets/additions/font-face.css: {}

toggle-section:
  js:
    assets/additions/js/toggle-section/toggle-section.js: {}

focus-trap:
  js:
    assets/additions/js/toggle-section/focus-trap.js: {}

gov-accordion-item:
  js:
    components/gov-accordion-item/gov-accordion-item.js: {}
  dependencies:
    - core/drupal
    - core/once

gov-infobar:
  header: true
  js:
    components/gov-infobar/gov-infobar-header.js: {}
  dependencies:
    - core/drupal
    - core/once
